# Three legs — ADR-0021 §8, ADR-0019 §7.
#
#   1. the Bun suite plus lint, typecheck and the hard-failing gates
#   2. the binary smoke leg on Linux
#   3. the same leg on Windows, whose whole purpose is the
#      %LOCALAPPDATA% / %APPDATA% resolution that is the only
#      Windows-specific code in pd
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: bun suite, lint and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Includes the generated-operation, restricted-import and stderr gates.
      - run: bun test
      # Separate command: fixture credential leakage is a gate, not a warning.
      - run: bun run gates

  binary-linux:
    name: binary smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Version agreement, docs, fixture exclusion and CWD .env refusal.
      - run: bun run gates dist/pd

  binary-windows:
    name: binary smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Also drives auth status through the Windows path mapping.
      - run: bun run gates dist/pd.exe
